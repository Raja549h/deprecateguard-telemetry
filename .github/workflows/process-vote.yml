name: Process Vote Issue
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write

jobs:
  process-vote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Parse and Record Vote
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os, json, re, urllib.request, urllib.error
          from datetime import datetime, timedelta

          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          issue_num = os.environ.get("ISSUE_NUMBER", "")
          author = os.environ.get("ISSUE_AUTHOR", "")
          token = os.environ.get("GH_TOKEN", "")

          def close_issue(msg):
              req = urllib.request.Request(f"https://api.github.com/repos/${{ github.repository }}/issues/{issue_num}/comments",
                  data=json.dumps({"body": msg}).encode(),
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github.v3+json"})
              urllib.request.urlopen(req)
              req_close = urllib.request.Request(f"https://api.github.com/repos/${{ github.repository }}/issues/{issue_num}",
                  method="PATCH", data=json.dumps({"state": "closed"}).encode(),
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github.v3+json"})
              urllib.request.urlopen(req_close)
              exit(0)

          # 1. Anti-Sybil Auth (30 days)
          try:
              req_user = urllib.request.Request(f"https://api.github.com/users/{author}", headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req_user) as resp:
                  user_data = json.loads(resp.read())
                  created_at_str = user_data.get("created_at")
                  if created_at_str:
                      created_at = datetime.strptime(created_at_str, "%Y-%m-%dT%H:%M:%SZ")
                      if (datetime.utcnow() - created_at).days < 30:
                          close_issue(f"Vote rejected: Account must be at least 30 days old. Account created at {created_at_str}.")
          except Exception as e:
              close_issue(f"Error validating user age: {e}")

          # 2. Parse Title
          match = re.match(r"^VOTE-(confirm|false_positive)-(.+)$", title)
          if not match:
              close_issue("Invalid vote format.")

          vote = match.group(1)
          finding_id = match.group(2)

          # 3. Parse RepoHash from body
          repo_hash = "unknown"
          hash_match = re.search(r"RepoHash:\s*([a-f0-9]+)", body)
          if hash_match:
              repo_hash = hash_match.group(1)

          try:
              with open("votes.json", "r") as f:
                  votes = json.load(f)
          except:
              votes = []

          votes.append({
              "finding_id": finding_id,
              "vote": vote,
              "timestamp": datetime.utcnow().isoformat() + "Z",
              "repo_hash": repo_hash,
              "author": author
          })

          with open("votes.json", "w") as f:
              json.dump(votes, f, indent=2)

          # 4. Recompute metrics
          tp = len([v for v in votes if v["vote"] == "confirm"])
          fp = len([v for v in votes if v["vote"] == "false_positive"])
          distinct_repos = len(set([v["repo_hash"] for v in votes if v["repo_hash"] != "unknown"]))

          metrics = {
              "total_votes": len(votes),
              "confirm_count": tp,
              "false_positive_count": fp,
              "distinct_repos": distinct_repos
          }
          
          assert metrics["total_votes"] == len(votes), "Mismatch between computed metrics and votes array"
          
          # Gate precision display behind >=100 votes across >=10 repos
          if len(votes) >= 100 and distinct_repos >= 10:
              precision = tp / (tp + fp) if (tp + fp) > 0 else 1.0
              metrics["precision"] = round(precision, 4)

          with open("metrics.json", "w") as f:
              json.dump(metrics, f, indent=2)

          close_issue("Vote recorded.")
        shell: python

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add votes.json metrics.json
          git commit -m "Record vote and update metrics" || exit 0
          git push
